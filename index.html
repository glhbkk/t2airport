<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d4a;
    --accent: #3b82f6;
    --accent2: #60a5fa;
    --accent-glow: rgba(59,130,246,0.25);
    --highlight: #f59e0b;
    --highlight2: #fbbf24;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
    --green: #10b981;
    --red: #ef4444;
    --s-grade: #f59e0b;
    --a-grade: #3b82f6;
    --b-grade: #8b5cf6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .terminal-sel-btn.active {
    background: var(--accent) !important;
    color: #fff !important;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    flex-wrap: nowrap;
    gap: 0.5rem;
  }
  header h1 {
    font-size: 1.2rem;
    white-space: nowrap;
  }

  .key-search-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 0.6rem 1.2rem;
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .key-search-btn:hover {
    border-color: var(--highlight);
    color: var(--highlight);
  }

  /* Modal */
  .key-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .key-modal-overlay.open { display: block; }

  .key-modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(95vw, 560px);
    height: 95vh;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    z-index: 101;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .key-modal.open { display: flex; }

  .key-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1.2rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text);
  }

  .key-modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0.2rem 0.4rem;
    border-radius: 6px;
    transition: all 0.15s;
  }

  .key-modal-close:hover { color: var(--text); background: var(--surface2); }

  .key-search-input {
    margin: 1rem 1.4rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.8rem 1rem;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .key-search-input:focus { border-color: var(--accent); }
  .key-search-input::placeholder { color: var(--text-muted); }

  .key-results {
    overflow-y: auto;
    padding: 0 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    flex: 1;
    min-height: 0;
  }

  .key-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.7rem 1rem;
    transition: border-color 0.15s;
  }

  .key-item:hover { border-color: var(--accent); }

  .key-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    color: var(--highlight);
    min-width: 36px;
    text-align: center;
    background: rgba(245,158,11,0.1);
    border: 1px solid rgba(245,158,11,0.25);
    border-radius: 6px;
    padding: 0.2rem 0.4rem;
  }

  .key-name {
    font-size: 0.9rem;
    color: var(--text);
    flex: 1;
  }

  .key-category {
    font-size: 0.68rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .key-empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.88rem;
    padding: 2rem;
  }


  .header-left h1 {
    font-size: 1.9rem;
    font-weight: 900;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #e2e8f0 0%, #60a5fa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-left p {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-top: 0.3rem;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Date nav */
  .date-nav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
    margin-bottom: 1.5rem;
  }

  .date-nav-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }

  .date-nav-btn:hover { border-color: var(--accent); }

  .date-nav-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
  }

  .date-nav-btn.active .nav-label,
  .date-nav-btn.active .nav-date,
  .date-nav-btn.active .nav-day { color: #fff !important; }

  .nav-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }

  .nav-date {
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--accent2);
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
  }

  .nav-day {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 0.25rem;
    font-weight: 500;
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.2rem;
  }

  .stat-card .stat-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.3rem;
  }

  .stat-card .stat-value {
    font-size: 1.6rem;
    font-weight: 900;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent2);
  }

  .stat-card .stat-sub {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 0.2rem;
  }

  /* Section heading */
  .section-heading {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 1rem;
    margin-top: 1.8rem;
  }

  .section-heading h2 {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .section-heading .line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Inspection cards */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }

  .insp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2rem 1.4rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .insp-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
